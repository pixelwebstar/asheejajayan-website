<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#500000;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (Optional, for dark theme visibility) -->
  <circle cx="256" cy="256" r="256" fill="#050000"/>

  <!-- Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#C41E3A" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#C41E3A" stroke-width="8" opacity="0.2"/>

  <!-- Particles -->
  <circle cx="436" cy="256" r="12" fill="#C41E3A" filter="url(#glow)"/>
  <circle cx="256" cy="76" r="12" fill="#C41E3A" filter="url(#glow)"/>
  <circle cx="76" cy="256" r="12" fill="#C41E3A" filter="url(#glow)"/>
  <circle cx="256" cy="436" r="12" fill="#C41E3A" filter="url(#glow)"/>

  <!-- Central "L" Monogram -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="serif" font-weight="bold" font-size="280" fill="url(#grad1)" filter="url(#glow)">L</text>
</svg>
